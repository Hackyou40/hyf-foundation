<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts House Generator</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">

        <h1>Hogwarts House Generator</h1>

        <p class="subtitle">Discover your Hogwarts house!</p>

        <div class="input-area">
            <input type="text" id="name" placeholder="Enter your name">

            <button id="find-house">Find My House</button>
        </div>

        <p id="result">Enter your name and click the button!</p>

    </div>
    <script src="script.js"></script>
</body>

</html>
